<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Table Not Found | Aura Bistro</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background-color: #0C0F14;
        color: #F3EFEA;
        font-family: 'Plus Jakarta Sans', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        background: rgba(20, 26, 35, 0.8);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 24px;
        padding: 48px 32px;
        max-width: 480px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      }
      h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 72px;
        margin: 0;
        color: #D4AF37;
      }
      h2 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 28px;
        margin: 8px 0 16px;
      }
      p {
        color: #9CA3AF;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a {
        display: inline-block;
        background: linear-gradient(135deg, #D4AF37, #B89222);
        color: #000;
        text-decoration: none;
        padding: 12px 32px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <h2>Course Not Found</h2>
      <p>The page or vintage you requested is currently unavailable. Please return to the dining salon.</p>
      <a href="/">Return to Home</a>
    </div>
  </body>
</html>
